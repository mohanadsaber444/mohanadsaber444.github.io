<!doctype html>
<html lang="{{ page.lang | default: 'ar' }}" dir="{{ page.dir | default: 'rtl' }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ page.title | escape }} | MOHANNED SABER</title>
<meta name="description" content="{{ page.description | strip_html | escape }}">
<meta name="robots" content="index,follow">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta property="og:type" content="article">
<meta property="og:title" content="{{ page.title | escape }}">
<meta property="og:description" content="{{ page.description | escape }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="article:published_time" content="{{ page.date | date_to_xmlschema }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Work+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#080B18;--panel:#10182b;--line:#26334c;--text:#f4f7ff;--muted:#aab5cc;--accent:#83b7bd}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:17px/1.95 Cairo,system-ui,sans-serif}
header{border-bottom:1px solid var(--line);padding:16px 22px}header a{max-width:820px;display:block;margin:auto;color:var(--accent);text-decoration:none;font:700 14px Work Sans,sans-serif}
main{max-width:820px;margin:54px auto;padding:0 24px 70px}h1{font-size:clamp(2rem,5vw,3.2rem);line-height:1.4;margin:0 0 12px}h2{font-size:1.5rem;margin:38px 0 10px}h3{font-size:1.15rem}p,li{color:#c5cede}a{color:var(--accent)}.meta{font-size:14px;color:var(--muted);margin-bottom:28px}.content img{max-width:100%;height:auto}.content pre{direction:ltr;text-align:left;overflow:auto;padding:16px;background:#10182b;border:1px solid var(--line);border-radius:8px}.content code{font-family:Consolas,monospace}.content blockquote{border-right:3px solid var(--accent);padding:10px 18px;background:var(--panel);margin:20px 0}.tags{color:var(--muted);font-size:13px;margin-top:30px}
@media(max-width:600px){main{margin:34px auto;padding:0 18px 50px}body{font-size:16px}}
</style>
</head><body>
<header><a href="/ar.html">MOHANNED SABER / المقالات التقنية</a></header>
<main>
<article>
<h1>{{ page.title | escape }}</h1>
<div class="meta">بقلم {{ page.author | default: site.title }} · {{ page.date | date: "%Y-%m-%d" }}</div>
<div class="content">{{ content }}</div>
{% if page.tags %}<div class="tags">المواضيع: {{ page.tags | join: " · " }}</div>{% endif %}
</article>
<p><a href="/blog/">← العودة إلى المقالات</a></p>
</main></body></html>
